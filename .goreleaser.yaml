version: 2
project_name: gitdrift

before:
  hooks:
    - go mod tidy

builds:
  - id: gdrift
    main: ./cmd/gdrift
    binary: gdrift
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - "-s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }} -X main.date={{ .CommitDate }}"

archives:
  - formats: [tar.gz]
    # No version in the name, so that releases/latest/download/<name> always
    # serves the newest release; gdrift --version reports the version.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs"
      - "^test"
      - "^ci"
      - "^chore"
      - "^style"

release:
  github:
    owner: epicentre
    name: gitdrift
